# Tag-triggered release. `npm run release [patch|minor|major|x.y.z]` bumps the
# version, runs the gate, commits, tags v* and pushes — this takes it from
# there.
#
# The site is published to bitplane/amos.bitplane.net twice: once to an
# immutable /v/<version>/ that a page can pin and cache forever, and once to
# the moving /v/latest/. Versions are paths, never query parameters, so a URL
# identifies exactly which code runs.
name: release

# `npm run redeploy` fires the workflow_dispatch below on whatever branch you
# are on, so a fix can be rebuilt over the version already published without
# cutting a release for it. The version it publishes AS defaults to the latest
# tag, which is what `/` and `/v/latest/` are already serving.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this version, e.g. 0.9.4 (default: the latest tag)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the whole history, because a dispatch run has to find the latest
          # tag to know what version it is republishing
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The tag is cut by `npm version`, which already runs this — but a
      # workflow_dispatch build has not been through that gate, and a green
      # tag that nobody can reproduce is worth less than a slow one.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build:web

      # A tag push publishes the tag. A dispatch publishes whatever it was
      # asked for, or the latest tag, which is the version the site is
      # already serving and so the one a rebuild should land on top of.
      - name: Which version this is
        id: v
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            case "$GITHUB_REF_TYPE" in
              tag) v="$GITHUB_REF_NAME" ;;
              *)   v="$(git describe --tags --abbrev=0)" ;;
            esac
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      # One publish, not three. The action starts an ssh-agent on a fixed
      # socket path, so calling it more than once in a job dies with
      # "cannot bind to path /tmp/ssh-auth.sock: Address already in use" —
      # which is how the first release failed. Assembling the tree first is
      # better anyway: one commit per release instead of three, and the
      # version and latest copies can never disagree.
      #
      # The root is the player itself, not a page about the player. The same
      # build goes to three places: / and /v/latest/ both move, /v/<version>/
      # does not.
      #
      # keep_files, because this publishes the whole site root and must not
      # delete the versions already there. Nothing accumulates: asset
      # filenames are stable (see vite.web.config.ts), so the moving copies
      # are overwritten in place rather than gathering a bundle per release.
      - name: Assemble the site
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p site/v/"$v" site/v/latest
          cp -r dist-web/.         site/
          cp -r dist-web/.         site/v/"$v"/
          cp -r dist-web/.         site/v/latest/
          find site -type f | sort

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: bitplane/amos.bitplane.net
          publish_branch: release
          publish_dir: site
          keep_files: true
          cname: amos.bitplane.net
          commit_message: "v${{ steps.v.outputs.version }}"
