<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amos-ts</title>
    <link rel="stylesheet" href="/src/web/ui/style.css" />
  </head>
  <body>
    <header id="top">
      <div class="wrap">
        <div id="masthead">
          <span id="brand">amos-ts</span>
          <span id="tagline">AMOS Professional, in a browser</span>
          <span id="version" title="which build of the player this page loaded"></span>
          <a id="repo" href="https://github.com/bitplane/amos-ts">github.com/bitplane/amos-ts</a>
        </div>
        <nav id="tabbar"></nav>
        <div id="strip-host"></div>
      </div>
    </header>

    <main class="wrap" id="panels">
      <div id="panel-emulator">
        <div id="bar">
          <input type="file" id="file" accept=".amos,.AMOS,.txt,.zip,.tar,.gz,.abk,.iff,.adf" multiple />
          <button class="act" id="restart">Restart</button>
          <button class="act" id="serial" hidden title="Grant this page a serial port, so Serial Open reaches real hardware. Chromium only.">Serial port…</button>
          <label><input type="checkbox" id="turbo" /> turbo</label>
          <label title="Real gamepads always drive the joystick ports. Optionally map keys too.">Keyboard→Joy1
            <select id="kb1"><option value="">off</option><option value="arrows">arrows</option><option value="wasd">WASD</option></select></label>
          <label>Joy0
            <select id="kb0"><option value="">off</option><option value="wasd">WASD</option><option value="arrows">arrows</option></select></label>
        </div>
        <div id="player"></div>
      </div>

      <div id="panel-files">
        <p class="panel-intro">
          Drop .AMOS programs, data files, folders, zips or .adf disk images anywhere on the page.
          Drag a row onto a drawer to move it.
        </p>
        <div id="fstree"></div>
      </div>
    </main>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
