<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>amos-ts</title>
    <style>
      body {
        background: #1a1a1a;
        color: #ddd;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      canvas {
        image-rendering: pixelated;
        width: min(960px, 95vw);
        aspect-ratio: 640 / 572;
        border: 2px solid #444;
        background: #000;
        /* the AMOS pointer is composited like the real machine's
           hardware sprite 0 — hide the OS cursor over the display */
        cursor: none;
      }
      #bar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      #status {
        color: #8c8;
      }
      #line {
        width: min(640px, 95vw);
        background: #000;
        color: #fa0;
        border: 1px solid #444;
        padding: 4px 8px;
        font-family: monospace;
      }
      body.dragging {
        outline: 3px dashed #fa0;
        outline-offset: -6px;
      }
      #files {
        width: min(960px, 95vw);
        border: 1px solid #444;
        padding: 6px 10px;
      }
      #files summary {
        cursor: pointer;
        color: #8c8;
      }
      #fstree {
        max-height: 40vh;
        overflow-y: auto;
        white-space: pre;
        line-height: 1.35;
      }
      #fstree .vol {
        color: #fa0;
      }
      #fstree a {
        color: #8cf;
        cursor: pointer;
        text-decoration: underline;
      }
      #fstree a.dir {
        color: #cc8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <input type="file" id="file" accept=".amos,.AMOS,.txt,.zip,.tar,.gz,.abk,.iff" multiple />
      <button id="restart">Restart</button>
      <label><input type="checkbox" id="turbo" /> turbo</label>
      <label title="Real gamepads always drive the joystick ports. Optionally map keys too.">Keyboard→Joy1
        <select id="kb1"><option value="">off</option><option value="arrows">arrows</option><option value="wasd">WASD</option></select></label>
      <label>Joy0
        <select id="kb0"><option value="">off</option><option value="wasd">WASD</option><option value="arrows">arrows</option></select></label>
      <span id="status"></span>
    </div>
    <canvas id="screen" width="640" height="572"></canvas>
    <input id="line" placeholder="Input line — press Enter to submit" />
    <details id="files">
      <summary>Files — drop .AMOS programs, data files, folders or zips anywhere on the page</summary>
      <div id="fstree"></div>
    </details>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
